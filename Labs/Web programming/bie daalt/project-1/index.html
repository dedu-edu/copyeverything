<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project-1 Counter</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <h1 class="flex justify-center text-blue-600 text-[100px] font-extrabold">Counter</h1>
        <div id="counter" class="flex justify-center text-[150px]">0
        </div>
        <div class="flex justify-center mt-10">
            <button id="decrease" class="border-4 border-black mx-10 px-5 rounded-full hover:border-red-600 transition duration-500 hover:scale-150">Decrease</button>
            <button id="reset" class="border-4 border-black mx-10 px-5 rounded-full hover:border-gray-600 transition duration-500 hover:scale-150">Reset</button>
            <button id="increase" class="border-4 border-black mx-10 px-5 rounded-full hover:border-green-500 transition duration-500 hover:scale-150">Increase</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
